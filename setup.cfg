[bdist_wheel]
# The cffi-generated extension module is compiled with Py_LIMITED_API
# (cffi's default), so tag the wheels accordingly: a single cp310-abi3
# wheel per platform covers CPython 3.10 and all later versions.
py_limited_api = cp310
